[project]
name = "byd-sentry-gnodin"
version = "0.1.0"
description = "Find BYD sentry clips where people came close to the car"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "Alec", email = "4496308+lectops@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
    "ultralytics>=8.4.183",
]

# Windows (RTX box): CUDA build of PyTorch. macOS keeps the PyPI build (Apple GPU / MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
